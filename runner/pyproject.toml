[project]
name = "runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Goran Ivancic", email = "goran.ivancic@fer.unizg.hr" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "kubernetes>=37.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
runner = "runner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyright]
typeCheckingMode = "basic"
reportOptionalMemberAccess = "none"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.11"
