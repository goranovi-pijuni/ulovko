name: Generate PlantUML diagrams

on:
  push:
    branches-ignore:
      - main
    paths:
      - "docs/puml/**/*.puml"
      - ".github/workflows/generate-puml-diagrams.yaml"

permissions:
  contents: write

concurrency:
  group: plantuml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Download PlantUML
        env:
          PLANTUML_VERSION: '1.2025.4'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Render SVGs
        shell: bash
        run: |
          set -euo pipefail
          source_dir="docs/puml"
          output_dir="docs/assets/diagrams/plantuml"
          mkdir -p "$output_dir"

          while IFS= read -r -d '' file; do
            rel="${file#${source_dir}/}"
            dest="$GITHUB_WORKSPACE/$output_dir/$(dirname "$rel")"
            mkdir -p "$dest"
            java -jar "$RUNNER_TEMP/plantuml.jar" -charset UTF-8 -tsvg -failonerror -o "$dest" "$file"
          done < <(find "$source_dir" -type f -name '*.puml' -print0)

          # Remove only orphaned generated SVGs; preserve diagrams from other sources.
          while IFS= read -r -d '' svg; do
            rel="${svg#${output_dir}/}"
            if [[ ! -f "$source_dir/${rel%.svg}.puml" ]]; then
              rm -- "$svg"
            fi
          done < <(find "$output_dir" -type f -name '*.svg' -print0)

      - name: Commit to source branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- docs/assets/diagrams/plantuml
          if git diff --cached --quiet; then
            echo "Diagrams are up to date."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: regenerate PlantUML diagrams'
          git push origin "HEAD:${GITHUB_REF}"
