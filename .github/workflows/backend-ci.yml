name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Test and build
    runs-on: ubuntu-latest

    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ulovko_migrator
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ulovko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ulovko_migrator -d ulovko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ulovko_migrator:test_password@127.0.0.1:5432/ulovko

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            test:
              - 'backend/**'
              - 'db/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/backend-deploy.yml'
            deploy:
              - 'backend/**'
              - 'db/**'
              - '.github/workflows/backend-deploy.yml'

      - name: Set up Node.js
        if: steps.changes.outputs.test == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.test == 'true'
        run: npm ci

      - name: Apply schema to test database
        if: steps.changes.outputs.test == 'true'
        run: npm run db:push

      - name: Run unit tests
        if: steps.changes.outputs.test == 'true'
        run: npm test

      - name: Build application
        if: steps.changes.outputs.test == 'true'
        run: npm run build

  deploy:
    name: Deploy backend
    needs: backend

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.backend.outputs.deploy == 'true'

    uses: ./.github/workflows/backend-deploy.yml
    secrets: inherit
