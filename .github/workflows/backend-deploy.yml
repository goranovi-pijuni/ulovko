name: Backend CD

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    environment:
      name: production
      url: https://ulovko.fun/api

    concurrency:
      group: ulovko-backend-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Open PostgreSQL tunnel
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -f -N \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -L 15432:127.0.0.1:5432 \
            "deploy@${HOST}"

      - name: Apply database changes
        env:
          DATABASE_URL: ${{ secrets.DB_MIGRATION_URL }}
        run: npm run db:push

      - name: Upload build to VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          rsync -az --delete -e "$SSH" \
            dist/ "deploy@${HOST}:/opt/ctf/backend/dist/"

          rsync -az -e "$SSH" \
            package.json package-lock.json \
            "deploy@${HOST}:/opt/ctf/backend/"

      - name: Upload application environment
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DB_APP_URL: ${{ secrets.DB_APP_URL }}
          RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
          RUNNER_API_URL: ${{ vars.RUNNER_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$DB_APP_URL" && test -n "$RUNNER_API_TOKEN" && test -n "$RUNNER_API_URL"
          test -n "$GOOGLE_CLIENT_ID" && test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_CALLBACK_URL" && test -n "$SESSION_SECRET"
          test "${#SESSION_SECRET}" -ge 32 || { echo 'SESSION_SECRET must be at least 32 characters.' >&2; exit 1; }
          [[ "$GOOGLE_CALLBACK_URL" == 'https://ulovko.fun/api/auth/google/callback' ]] || {
            echo 'GOOGLE_CALLBACK_URL must match the configured Google OAuth redirect.' >&2
            exit 1
          }
          for value in "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$GOOGLE_CALLBACK_URL" "$SESSION_SECRET"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo 'Google and session settings must be single-line values.' >&2
              exit 1
            }
          done
          [[ "$DB_APP_URL" == postgresql://* || "$DB_APP_URL" == postgres://* ]] || {
            echo 'DB_APP_URL must be a PostgreSQL connection URL.' >&2
            exit 1
          }
          [[ "$DB_APP_URL" != *$'\n'* && "$DB_APP_URL" != *$'\r'* ]] || {
            echo 'DB_APP_URL must fit on a single line.' >&2
            exit 1
          }
          [[ "$RUNNER_API_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]] || exit 1
          [[ "$RUNNER_API_URL" =~ ^https?://[a-zA-Z0-9.:-]+/?$ ]] || {
            echo 'RUNNER_API_URL must be a trusted HTTP(S) host and optional port.' >&2
            exit 1
          }

          umask 077
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT

          # Build the backend environment from dedicated Actions secrets/variables.
          {
            printf 'NODE_ENV=production\nPORT=3000\n'
            printf 'DATABASE_URL=%s\n' "$DB_APP_URL"
            printf 'RUNNER_API_TOKEN=%s\n' "$RUNNER_API_TOKEN"
            printf 'RUNNER_API_URL=%s\n' "$RUNNER_API_URL"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'GOOGLE_CALLBACK_URL=%s\n' "$GOOGLE_CALLBACK_URL"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
          } > "$env_file"

          SSH="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az -e "$SSH" "$env_file" \
            "deploy@${HOST}:/opt/ctf/backend/.env.next"

      - name: Install production dependencies and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/ctf/backend
          chmod 600 .env.next
          mv -f .env.next .env
          npm ci --omit=dev

          sudo systemctl restart ctf-backend.service
          sudo systemctl is-active ctf-backend.service

          curl --silent --show-error \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            -o /dev/null \
            http://127.0.0.1:3000/
          REMOTE
