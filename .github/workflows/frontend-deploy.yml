name: Frontend CD

on:
  workflow_call:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    environment:
      name: production
      url: https://ulovko.fun

    concurrency:
      group: ulovko-frontend-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.9
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build to VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          rsync -az --delete --chmod=D755,F644 -e "$SSH" \
            dist/ "deploy@${HOST}:/opt/ctf/frontend/dist/"

      - name: Verify deployment
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${HOST}" 'test -r /opt/ctf/frontend/dist/index.html'

          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 2 --retry-all-errors \
            -o /dev/null https://ulovko.fun/
