name: CD

on:
  workflow_call:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    environment:
      name: production
      url: https://api.ulovko.fun/api

    concurrency:
      group: ulovko-backend-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build to VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          rsync -az --delete -e "$SSH" \
            dist/ "deploy@${HOST}:/opt/ctf/backend/dist/"

          rsync -az -e "$SSH" \
            package.json package-lock.json \
            "deploy@${HOST}:/opt/ctf/backend/"

      - name: Install production dependencies and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@${HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/ctf/backend
          npm ci --omit=dev

          sudo systemctl restart ctf-backend.service
          sudo systemctl is-active ctf-backend.service

          curl --silent --show-error \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            -o /dev/null \
            http://127.0.0.1:3000/
          REMOTE
